# ──────────────────────────────────────────────────────────────
# SUATS — Production Docker Compose
# ──────────────────────────────────────────────────────────────
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f        # Follow logs
#   docker compose down           # Stop all services
#   docker compose pull && docker compose up -d  # Update images
# ──────────────────────────────────────────────────────────────

services:
  # ── Backend (Node.js / Express) ──────────────────────────────
  backend:
    image: ${BACKEND_IMAGE:-suats-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: suats-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=7800
    ports:
      - "7800:7800"
    networks:
      - suats-network
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7800/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── Frontend (Nginx + React SPA) ─────────────────────────────
  frontend:
    image: ${FRONTEND_IMAGE:-suats-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:7800/api/v1}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:7800}
    container_name: suats-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - suats-network
    depends_on:
      backend:
        condition: service_healthy

  # ── MongoDB (optional — remove if using Atlas) ───────────────
  mongo:
    image: mongo:7
    container_name: suats-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    networks:
      - suats-network
    environment:
      MONGO_INITDB_DATABASE: suats
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ── Volumes ────────────────────────────────────────────────────
volumes:
  mongo-data:
    driver: local
  mongo-config:
    driver: local

# ── Networks ───────────────────────────────────────────────────
networks:
  suats-network:
    driver: bridge
