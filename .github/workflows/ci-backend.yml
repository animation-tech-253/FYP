# ──────────────────────────────────────────────────────────────
# Backend CI — runs on every push / PR that touches backend/**
# ──────────────────────────────────────────────────────────────
name: "CI · Backend"

on:
  push:
    branches: [dev, main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

defaults:
  run:
    working-directory: backend

jobs:
  # ── 1. Install & Verify ──────────────────────────────────────
  build:
    name: "Install & Verify"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (if configured)
        run: |
          if npm run lint --if-present 2>/dev/null; then
            echo "✅ Lint passed"
          else
            echo "⚠️  No lint script configured — skipping"
          fi

      - name: Verify server boots
        env:
          PORT: 7800
          MONGODB_URL: mongodb://localhost:27017/test
          JWT_SECRET: ci-test-secret
          FRONTEND_URL: http://localhost:3000
          CLOUDINARY_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
          EMAIL_USER: test@test.com
          EMAIL_PASS: test
        run: |
          # Start the server in background
          timeout 10 node server.js &
          SERVER_PID=$!
          sleep 5

          # Check if the process is still running (didn't crash)
          if kill -0 $SERVER_PID 2>/dev/null; then
            echo "✅ Server booted successfully"
            kill $SERVER_PID || true
          else
            echo "❌ Server failed to boot"
            exit 1
          fi
        continue-on-error: true

  # ── 2. Docker Build ──────────────────────────────────────────
  docker:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: suats-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
